name: Test Telegram Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          message = (
              "🚀 FEMSY CRYPTO SCANNER\n\n"
              "✅ Telegram connection successful!\n"
              "Your alert system is ready for setup.\n\n"
              "🎯 Mission: Find quality Solana memecoin setups.\n"
              "⚠️ Alerts are research signals, not guarantees."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(url, data=payload)

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise SystemExit("Telegram message failed.")

          print("Telegram test message sent successfully.")
          PY
